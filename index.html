<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>LEGO Technic Control</title>
<style>
body{font-family:system-ui,sans-serif;background:#f2f3f5;margin:0;padding:24px;text-align:center}
main{max-width:520px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 4px 20px #0002}
button{font-size:20px;padding:16px 22px;margin:8px;border:0;border-radius:14px}
#connect{background:#222;color:#fff} #send{background:#ddd}
#send:disabled{opacity:.45} #status{margin:18px 0;font-weight:700;overflow-wrap:anywhere}
</style>
</head>
<body><main>
<h1>LEGO Technic</h1>
<p>micro:bit Bluetooth UART</p>
<button id="connect">Připojit micro:bit</button>
<div id="status">Nepřipojeno</div>
<button id="send" disabled>Poslat F</button>
</main>
<script>
const UART_SERVICE_UUID="6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const UART_TX_CHARACTERISTIC_UUID="6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const UART_RX_CHARACTERISTIC_UUID="6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let uBitDevice;
let rxCharacteristic;
const status=document.getElementById("status");
const send=document.getElementById("send");

document.getElementById("connect").onclick=async()=>{
 try{
  status.textContent="Hledám micro:bit…";
  uBitDevice=await navigator.bluetooth.requestDevice({
   filters:[{namePrefix:"BBC micro:bit"}],
   optionalServices:[UART_SERVICE_UUID]
  });
  status.textContent="Připojuji…";
  const server=await uBitDevice.gatt.connect();
  const service=await server.getPrimaryService(UART_SERVICE_UUID);
  const txCharacteristic=await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);
  await txCharacteristic.startNotifications();
  rxCharacteristic=await service.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);
  uBitDevice.addEventListener("gattserverdisconnected",()=>{
   status.textContent="Odpojeno"; send.disabled=true; rxCharacteristic=null;
  });
  status.textContent="Připojeno: "+(uBitDevice.name||"micro:bit");
  send.disabled=false;
 }catch(e){status.textContent="Chyba: "+e.message;}
};

document.getElementById("send").onclick=async()=>{
 try{
  await rxCharacteristic.writeValue(new TextEncoder().encode("F\n"));
  status.textContent="Odesláno: F";
 }catch(e){status.textContent="Chyba: "+e.message;}
};
</script>
</body></html>
