<!doctype html>
<html lang="cs">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    >

    <title>LEGO Technic Control</title>

    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #111;
            color: white;
        }

        main {
            width: 100%;
            height: 100dvh;

            display: flex;
            flex-direction: column;

            padding:
                max(8px, env(safe-area-inset-top))
                max(12px, env(safe-area-inset-right))
                max(8px, env(safe-area-inset-bottom))
                max(12px, env(safe-area-inset-left));
        }


        /* ========================================
           HORNÍ LIŠTA
           ======================================== */

        .topbar {
            flex: 0 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;
        }

        h1 {
            font-size: clamp(17px, 3vw, 25px);
            margin: 0;
            white-space: nowrap;
        }

        .connection {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #connect {
            border: 0;
            border-radius: 10px;

            padding: 9px 14px;

            font-size: 14px;
            font-weight: bold;

            background: #eee;
            color: #111;
        }

        #status {
            font-size: 13px;
            font-weight: bold;
        }

        #stop {
            border: 0;
            border-radius: 10px;

            padding: 10px 18px;

            font-size: 15px;
            font-weight: bold;

            background: #d62828;
            color: white;
        }


        /* ========================================
           OVLADAČE
           ======================================== */

        #controllers {
            flex: 1 1 auto;

            min-height: 0;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: clamp(10px, 4vw, 50px);

            align-items: center;
            justify-items: center;
        }

        .controller {
            width: 100%;
            height: 100%;

            min-width: 0;
            min-height: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;
        }

        .controller h2 {
            margin: 2px 0 5px;

            font-size: clamp(13px, 2.5vw, 19px);
        }


        /* ========================================
           JOYSTICK
           ======================================== */

        .joystick {
            position: relative;

            width: min(38vw, 58vh, 250px);
            height: min(38vw, 58vh, 250px);

            max-width: 100%;
            max-height: 100%;

            border-radius: 50%;

            background: #292929;
            border: 3px solid #555;

            flex-shrink: 1;
        }

        .stick {
            position: absolute;

            width: 38%;
            height: 38%;

            left: 31%;
            top: 31%;

            border-radius: 50%;

            background: #eee;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.55);

            pointer-events: none;
        }

        .value {
            margin-top: 4px;

            font-size: clamp(13px, 2.5vw, 20px);
            font-weight: bold;
        }

        .disabled {
            opacity: 0.35;
            pointer-events: none;
        }


        /* ========================================
           TELEFON NA VÝŠKU
           ======================================== */

        @media (orientation: portrait) {

            main {
                padding: 8px;
            }

            .topbar {
                flex-wrap: wrap;
            }

            #controllers {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .joystick {
                width: min(43vw, 32vh);
                height: min(43vw, 32vh);
            }

            #status {
                display: none;
            }
        }


        /* ========================================
           MALÁ VÝŠKA - TELEFON NALEŽATO
           ======================================== */

        @media (max-height: 500px) {

            main {
                padding-top: 5px;
                padding-bottom: 5px;
            }

            .topbar {
                min-height: 38px;
            }

            .controller h2 {
                margin: 0 0 3px;
            }

            .joystick {
                width: min(32vw, 64vh);
                height: min(32vw, 64vh);
            }

            .value {
                margin-top: 2px;
            }
        }

    </style>
</head>


<body>

<main>


    <!-- ========================================
         HORNÍ LIŠTA
         ======================================== -->

    <div class="topbar">

        <h1>
            LEGO Technic
        </h1>


        <div class="connection">

            <button id="connect">
                Připojit
            </button>

            <span id="status">
                Nepřipojeno
            </span>

        </div>


        <button id="stop">
            STOP
        </button>

    </div>



    <!-- ========================================
         OVLADAČE
         ======================================== -->

    <div
        id="controllers"
        class="disabled"
    >


        <!-- ŘÍZENÍ -->

        <div class="controller">

            <h2>
                ŘÍZENÍ
            </h2>

            <div
                id="steering"
                class="joystick"
            >

                <div
                    id="steeringStick"
                    class="stick"
                ></div>

            </div>

            <div
                id="steeringValue"
                class="value"
            >
                0
            </div>

        </div>



        <!-- PLYN -->

        <div class="controller">

            <h2>
                PLYN
            </h2>

            <div
                id="throttle"
                class="joystick"
            >

                <div
                    id="throttleStick"
                    class="stick"
                ></div>

            </div>

            <div
                id="throttleValue"
                class="value"
            >
                0
            </div>

        </div>

    </div>

</main>



<script>

    // =====================================================
    // MICRO:BIT BLUETOOTH UART
    // =====================================================

    const UART_SERVICE =
        "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

    const UART_TX =
        "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    const UART_RX =
        "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


    let device;
    let rx;


    const statusElement =
        document.querySelector("#status");

    const controllers =
        document.querySelector("#controllers");



    // =====================================================
    // BLUETOOTH PŘIPOJENÍ
    // =====================================================

    document.querySelector("#connect").onclick =
        async () => {

            try {

                statusElement.textContent =
                    "Hledám…";


                device =
                    await navigator.bluetooth.requestDevice({

                        filters: [
                            {
                                namePrefix: "BBC micro:bit"
                            }
                        ],

                        optionalServices: [
                            UART_SERVICE
                        ]

                    });


                statusElement.textContent =
                    "Připojuji…";


                const server =
                    await device.gatt.connect();


                const service =
                    await server.getPrimaryService(
                        UART_SERVICE
                    );


                const tx =
                    await service.getCharacteristic(
                        UART_TX
                    );


                await tx.startNotifications();


                rx =
                    await service.getCharacteristic(
                        UART_RX
                    );


                controllers.classList.remove(
                    "disabled"
                );


                statusElement.textContent =
                    "Připojeno";


                device.addEventListener(
                    "gattserverdisconnected",
                    () => {

                        rx = null;

                        controllers.classList.add(
                            "disabled"
                        );

                        statusElement.textContent =
                            "Odpojeno";

                    }
                );

            }

            catch (error) {

                statusElement.textContent =
                    "Chyba";

                alert(
                    error.message
                );

            }

        };



    // =====================================================
    // ODESLÁNÍ PŘÍKAZU
    // =====================================================

    async function sendCommand(command) {

        if (!rx) {
            return;
        }


        try {

            const data =
                new TextEncoder().encode(
                    command + "\n"
                );


            if (
                typeof rx.writeValueWithoutResponse
                === "function"
            ) {

                await rx.writeValueWithoutResponse(
                    data
                );

            }

            else {

                await rx.writeValue(
                    data
                );

            }

        }

        catch (error) {

            statusElement.textContent =
                "Chyba komunikace";

        }

    }



    // =====================================================
    // JOYSTICK
    // =====================================================

    function createJoystick(
        areaID,
        stickID,
        valueID,
        type
    ) {

        const area =
            document.getElementById(areaID);

        const stick =
            document.getElementById(stickID);

        const value =
            document.getElementById(valueID);


        let active = false;


        area.addEventListener(
            "pointerdown",
            start
        );


        area.addEventListener(
            "pointermove",
            move
        );


        area.addEventListener(
            "pointerup",
            stop
        );


        area.addEventListener(
            "pointercancel",
            stop
        );


        function start(event) {

            active = true;

            area.setPointerCapture(
                event.pointerId
            );

            update(event);

        }


        function move(event) {

            if (!active) {
                return;
            }

            update(event);

        }


        function stop() {

            if (!active) {
                return;
            }

            active = false;


            stick.style.transform =
                "translate(0px, 0px)";


            value.textContent =
                "0";


            if (type === "steering") {

                sendCommand(
                    "S:0"
                );

            }


            if (type === "throttle") {

                sendCommand(
                    "M:0"
                );

            }

        }



        function update(event) {

            const rect =
                area.getBoundingClientRect();


            const centerX =
                rect.width / 2;

            const centerY =
                rect.height / 2;


            /*
             * Maximální pohyb páčky se počítá
             * podle skutečné velikosti joysticku.
             *
             * Díky tomu funguje správně i při
             * změně velikosti displeje.
             */

            const stickRadius =
                stick.offsetWidth / 2;


            const max =
                rect.width / 2 -
                stickRadius -
                5;



            // =====================================
            // ŘÍZENÍ
            // =====================================

            if (type === "steering") {

                let x =
                    event.clientX -
                    rect.left -
                    centerX;


                x =
                    Math.max(
                        -max,
                        Math.min(max, x)
                    );


                stick.style.transform =
                    `translate(${x}px, 0px)`;


                const steering =
                    Math.round(
                        x / max * 100
                    );


                value.textContent =
                    steering;


                sendCommand(
                    "S:" + steering
                );

            }



            // =====================================
            // PLYN
            // =====================================

            if (type === "throttle") {

                let y =
                    event.clientY -
                    rect.top -
                    centerY;


                y =
                    Math.max(
                        -max,
                        Math.min(max, y)
                    );


                stick.style.transform =
                    `translate(0px, ${y}px)`;


                const throttle =
                    Math.round(
                        -y / max * 100
                    );


                value.textContent =
                    throttle;


                sendCommand(
                    "M:" + throttle
                );

            }

        }

    }



    // =====================================================
    // VYTVOŘENÍ OBOU JOYSTICKŮ
    // =====================================================

    createJoystick(
        "steering",
        "steeringStick",
        "steeringValue",
        "steering"
    );


    createJoystick(
        "throttle",
        "throttleStick",
        "throttleValue",
        "throttle"
    );



    // =====================================================
    // NOUZOVÝ STOP
    // =====================================================

    document.querySelector("#stop").onclick =
        () => {

            sendCommand(
                "M:0"
            );

            sendCommand(
                "S:0"
            );


            document.getElementById(
                "steeringStick"
            ).style.transform =
                "translate(0px, 0px)";


            document.getElementById(
                "throttleStick"
            ).style.transform =
                "translate(0px, 0px)";


            document.getElementById(
                "steeringValue"
            ).textContent =
                "0";


            document.getElementById(
                "throttleValue"
            ).textContent =
                "0";

        };

</script>

</body>

</html>
