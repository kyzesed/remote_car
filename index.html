<!doctype html>
<html lang="cs">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, user-scalable=no"
    >

    <title>LEGO Technic Control</title>

    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 5px;
        }

        #connect {
            border: 0;
            border-radius: 14px;
            padding: 14px 24px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #status {
            margin: 14px 0 25px;
            font-weight: bold;
        }

        .controllers {
            display: flex;
            justify-content: space-around;
            gap: 30px;
            flex-wrap: wrap;
        }

        .controller {
            flex: 1;
            min-width: 260px;
        }

        .controller h2 {
            margin-bottom: 15px;
        }

        .joystick {
            width: 240px;
            height: 240px;
            margin: auto;
            position: relative;

            border-radius: 50%;
            background: #292929;

            border: 3px solid #555;
        }

        .stick {
            width: 90px;
            height: 90px;

            position: absolute;

            left: 75px;
            top: 75px;

            border-radius: 50%;

            background: #eee;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .value {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
        }

        .disabled {
            opacity: 0.35;
            pointer-events: none;
        }

        .stop {
            margin-top: 30px;

            width: 180px;
            height: 60px;

            border: 0;
            border-radius: 15px;

            font-size: 20px;
            font-weight: bold;

            background: #d62828;
            color: white;
        }

    </style>
</head>


<body>

<main>

    <h1>LEGO Technic</h1>

    <div>
        micro:bit Bluetooth Control
    </div>


    <button id="connect">
        Připojit micro:bit
    </button>


    <div id="status">
        Nepřipojeno
    </div>


    <div
        id="controllers"
        class="controllers disabled"
    >


        <!-- LEVÝ JOYSTICK -->

        <div class="controller">

            <h2>ŘÍZENÍ</h2>

            <div
                id="steering"
                class="joystick"
            >

                <div
                    id="steeringStick"
                    class="stick"
                ></div>

            </div>

            <div
                id="steeringValue"
                class="value"
            >
                0
            </div>

        </div>



        <!-- PRAVÝ JOYSTICK -->

        <div class="controller">

            <h2>PLYN</h2>

            <div
                id="throttle"
                class="joystick"
            >

                <div
                    id="throttleStick"
                    class="stick"
                ></div>

            </div>

            <div
                id="throttleValue"
                class="value"
            >
                0
            </div>

        </div>


    </div>


    <button
        id="stop"
        class="stop"
    >
        STOP
    </button>


</main>


<script>

    // =====================================================
    // MICRO:BIT BLUETOOTH UART
    // =====================================================

    const UART_SERVICE =
        "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

    const UART_TX =
        "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    const UART_RX =
        "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


    let device;
    let rx;


    const statusElement =
        document.querySelector("#status");

    const controllers =
        document.querySelector("#controllers");


    // =====================================================
    // PŘIPOJENÍ
    // =====================================================

    document.querySelector("#connect").onclick =
        async () => {

            try {

                statusElement.textContent =
                    "Hledám micro:bit…";


                device =
                    await navigator.bluetooth.requestDevice({

                        filters: [
                            {
                                namePrefix: "BBC micro:bit"
                            }
                        ],

                        optionalServices: [
                            UART_SERVICE
                        ]

                    });


                statusElement.textContent =
                    "Připojuji…";


                const server =
                    await device.gatt.connect();


                const service =
                    await server.getPrimaryService(
                        UART_SERVICE
                    );


                const tx =
                    await service.getCharacteristic(
                        UART_TX
                    );


                await tx.startNotifications();


                rx =
                    await service.getCharacteristic(
                        UART_RX
                    );


                controllers.classList.remove(
                    "disabled"
                );


                statusElement.textContent =
                    "Připojeno: " +
                    (device.name || "micro:bit");


                device.addEventListener(
                    "gattserverdisconnected",
                    () => {

                        rx = null;

                        controllers.classList.add(
                            "disabled"
                        );

                        statusElement.textContent =
                            "Odpojeno";

                    }
                );

            }

            catch (error) {

                statusElement.textContent =
                    "Chyba: " + error.message;

            }

        };


    // =====================================================
    // ODESLÁNÍ DAT DO MICRO:BITU
    // =====================================================

    async function sendCommand(command) {

        if (!rx) {
            return;
        }


        try {

            const data =
                new TextEncoder().encode(
                    command + "\n"
                );


            if (rx.writeValueWithoutResponse) {

                await rx.writeValueWithoutResponse(
                    data
                );

            }

            else {

                await rx.writeValue(
                    data
                );

            }

        }

        catch (error) {

            statusElement.textContent =
                "Chyba: " + error.message;

        }

    }


    // =====================================================
    // ŘÍZENÍ
    // =====================================================

    createJoystick(
        "steering",
        "steeringStick",
        "steeringValue",
        "steering"
    );


    // =====================================================
    // PLYN
    // =====================================================

    createJoystick(
        "throttle",
        "throttleStick",
        "throttleValue",
        "throttle"
    );


    // =====================================================
    // FUNKCE JOYSTICKU
    // =====================================================

    function createJoystick(
        areaID,
        stickID,
        valueID,
        type
    ) {

        const area =
            document.getElementById(areaID);

        const stick =
            document.getElementById(stickID);

        const value =
            document.getElementById(valueID);


        let active = false;


        area.addEventListener(
            "pointerdown",
            start
        );


        area.addEventListener(
            "pointermove",
            move
        );


        area.addEventListener(
            "pointerup",
            stop
        );


        area.addEventListener(
            "pointercancel",
            stop
        );


        function start(event) {

            active = true;

            area.setPointerCapture(
                event.pointerId
            );

            update(event);

        }


        function move(event) {

            if (!active) {
                return;
            }

            update(event);

        }


        function stop() {

            active = false;


            stick.style.transform =
                "translate(0px, 0px)";


            value.textContent =
                "0";


            if (type === "steering") {

                sendCommand(
                    "S:0"
                );

            }


            if (type === "throttle") {

                sendCommand(
                    "M:0"
                );

            }

        }


        function update(event) {

            const rect =
                area.getBoundingClientRect();


            const centerX =
                rect.width / 2;

            const centerY =
                rect.height / 2;


            let x =
                event.clientX -
                rect.left -
                centerX;


            let y =
                event.clientY -
                rect.top -
                centerY;


            const max =
                70;


            if (type === "steering") {

                x =
                    Math.max(
                        -max,
                        Math.min(max, x)
                    );


                stick.style.transform =
                    `translate(${x}px, 0px)`;


                const steering =
                    Math.round(
                        x / max * 100
                    );


                value.textContent =
                    steering;


                sendCommand(
                    "S:" + steering
                );

            }


            if (type === "throttle") {

                y =
                    Math.max(
                        -max,
                        Math.min(max, y)
                    );


                stick.style.transform =
                    `translate(0px, ${y}px)`;


                const throttle =
                    Math.round(
                        -y / max * 100
                    );


                value.textContent =
                    throttle;


                sendCommand(
                    "M:" + throttle
                );

            }

        }

    }


    // =====================================================
    // NOUZOVÝ STOP
    // =====================================================

    document.querySelector("#stop").onclick =
        () => {

            sendCommand("M:0");
            sendCommand("S:0");

        };

</script>

</body>

</html>
